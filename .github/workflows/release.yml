name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          expected="v$version"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag must be $expected, got $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Verify package
        run: npm run check

      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          args=(--provenance --access public)
          if [[ "$version" == *-* ]]; then
            args+=(--tag beta)
          fi
          npm publish "${args[@]}"
